[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "python-telegram-bot>=21.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fcp-bot = "fcp.bot:main"
